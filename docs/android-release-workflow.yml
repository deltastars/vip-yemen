name: vipyemen Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  android-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: capacitor-app/package-lock.json

      - name: Install web dependencies
        working-directory: capacitor-app
        run: npm ci

      - name: Build web app
        working-directory: capacitor-app
        run: npm run build

      - name: Sync Capacitor Android project
        working-directory: capacitor-app
        run: npx cap sync android

      - name: Build debug APK and release AAB
        working-directory: capacitor-app/android
        run: ./gradlew assembleDebug bundleRelease --no-daemon

      - name: Prepare release assets
        run: |
          mkdir -p release
          cp capacitor-app/android/app/build/outputs/apk/debug/app-debug.apk release/vipyemen.apk
          cp capacitor-app/android/app/build/outputs/bundle/release/app-release.aab release/vipyemen.aab
          zip -qr release/vipyemen-source.zip . -x 'node_modules/*' '.git/*' '.manus-logs/*' 'release/*' '*.keystore' '*.jks' '.env*' 'capacitor-app/android/build/*' 'capacitor-app/android/app/build/*'
          sha256sum release/vipyemen.apk release/vipyemen.aab release/vipyemen-source.zip > release/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/vipyemen.apk release/vipyemen.aab release/vipyemen-source.zip release/SHA256SUMS.txt \
            --title "vipyemen ${GITHUB_REF_NAME}" \
            --notes "APK is debug-signed for direct testing. AAB is generated from the production variant; configure the owner's release keystore before Google Play publication. Source, policy files, official icon, and checksums are included."
