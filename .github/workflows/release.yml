name: ViP Yemen Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 4.3.0)'
        required: true
        default: '4.3.0'

env:
  PACKAGE_NAME: com.vip.yemen

jobs:
  build-web:
    name: Build Web Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install website dependencies
        working-directory: website
        run: bun install --frozen-lockfile || bun install
      - name: Build website
        working-directory: website
        run: bun run build
      - name: Fix absolute paths for Capacitor
        run: |
          # Replace /images/ with ./images/ in compiled JS
          find website/dist/public -name "*.js" -exec sed -i 's|"/images/|"./images/|g' {} +
          find website/dist/public -name "*.js" -exec sed -i "s|'/images/|'./images/|g" {} +
          # Replace /media/ with ./media/ in compiled JS
          find website/dist/public -name "*.js" -exec sed -i 's|"/media/|"./media/|g' {} +
          find website/dist/public -name "*.js" -exec sed -i "s|'/media/|'./media/|g" {} +
          echo "Fixed absolute paths in built assets"
      - name: Prepare dist for Capacitor
        run: |
          rm -rf web-dist
          cp -r website/dist/public web-dist
          cp capacitor-app/public/icon-192.png web-dist/ 2>/dev/null || true
          cp capacitor-app/public/icon-512.png web-dist/ 2>/dev/null || true
          cp capacitor-app/public/brand-logo.png web-dist/ 2>/dev/null || true
          echo "dist prepared:"
          ls web-dist/
      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web-dist/
          retention-days: 1

  build-android:
    name: Build Android (APK + AAB)
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install Capacitor dependencies
        working-directory: capacitor-app
        run: npm ci || npm install
      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: capacitor-app/dist/
      - name: Verify dist has correct paths
        run: |
          echo "Checking index.html paths:"
          grep -E "src=|href=" capacitor-app/dist/index.html | head -10
          echo "---"
          # Verify no absolute /assets/ paths (would break in Capacitor)
          if grep -q 'src="/assets/' capacitor-app/dist/index.html; then
            echo "❌ FAIL: Found absolute /assets/ path in index.html"
            exit 1
          fi
          echo "✅ All asset paths are relative"
      - name: Sync Capacitor Android
        working-directory: capacitor-app
        run: npx cap sync android
      - name: Build debug APK
        working-directory: capacitor-app/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Build release APK
        working-directory: capacitor-app/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Build release AAB
        working-directory: capacitor-app/android
        run: ./gradlew bundleRelease --no-daemon --stacktrace
      - name: Rename builds
        run: |
          VERSION="${{ github.event.inputs.version }}"
          APK_DBG="capacitor-app/android/app/build/outputs/apk/debug"
          APK_REL="capacitor-app/android/app/build/outputs/apk/release"
          AAB="capacitor-app/android/app/build/outputs/bundle/release"
          [ -f "$APK_DBG/app-debug.apk" ] && mv "$APK_DBG/app-debug.apk" "$APK_DBG/ViP-Yemen-${VERSION}-debug.apk"
          [ -f "$APK_REL/app-release-unsigned.apk" ] && mv "$APK_REL/app-release-unsigned.apk" "$APK_REL/ViP-Yemen-${VERSION}-release.apk"
          [ -f "$AAB/app-release.aab" ] && mv "$AAB/app-release.aab" "$AAB/ViP-Yemen-${VERSION}-release.aab"
          echo "APK sizes:"
          ls -lh $APK_DBG/*.apk 2>/dev/null
          ls -lh $APK_REL/*.apk 2>/dev/null
          ls -lh $AAB/*.aab 2>/dev/null
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            capacitor-app/android/app/build/outputs/apk/debug/*.apk
            capacitor-app/android/app/build/outputs/apk/release/*.apk
            capacitor-app/android/app/build/outputs/bundle/release/*.aab
          retention-days: 90

  create-release:
    name: Create GitHub Release
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-builds
          path: release/
      - name: Create Source Archive
        run: |
          zip -r ViP-Yemen-${{ github.event.inputs.version }}-source.zip . \
            -x '.git/*' 'node_modules/*' '*/node_modules/*' '*/build/*' '*/dist/*' '.github/*' '*.apk' '*.aab' '*.idsig' 2>/dev/null || true
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: ViP Yemen v${{ github.event.inputs.version }}
          body: |
            ## ViP Yemen v${{ github.event.inputs.version }}

            ### 📱 Android Applications
            - **debug.apk** - Direct install on Android
            - **release.apk** - Release APK
            - **release.aab** - For Google Play Store

            ### 📦 Source Code
            - **source.zip** - Complete project source code

            ### 📋 Package Info
            - **Package**: `com.vip.yemen`
            - **Min Android**: 7.0 (SDK 24)
            - **Target Android**: 14 (SDK 36)

            ### 📥 Installation
            1. Download the debug APK for direct install
            2. For Google Play: use the AAB file
            3. Install over existing version (no uninstall needed)
          files: |
            release/*.apk
            release/*.aab
            ViP-Yemen-*-source.zip
          draft: false
          prerelease: false
