name: ViP Yemen Release Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.1.0)'
        required: true
        default: '1.1.0'

env:
  PACKAGE_NAME: com.vip.yemen
  NODE_VERSION: 22
  JAVA_VERSION: 17

jobs:
  # =============================================================================
  # Job 1: Build Web Assets
  # =============================================================================
  build-web:
    name: Build Web Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      
      - name: Install website dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile || pnpm install
      
      - name: Build website
        working-directory: website
        run: pnpm run build
      
      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: website/dist/
          retention-days: 1

  # =============================================================================
  # Job 2: Build Android APK and AAB
  # =============================================================================
  build-android:
    name: Build Android (APK + AAB)
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      
      - name: Install Capacitor dependencies
        working-directory: capacitor-app
        run: npm ci || npm install
      
      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: capacitor-app/dist/
      
      - name: Sync Capacitor Android
        working-directory: capacitor-app
        run: npx cap sync android
      
      - name: Build debug APK
        working-directory: capacitor-app/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      
      - name: Build release AAB
        working-directory: capacitor-app/android
        run: ./gradlew bundleRelease --no-daemon --stacktrace
      
      - name: Verify package name
        run: |
          APK_PATH="capacitor-app/android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            $ANDROID_HOME/build-tools/*/aapt2 dump badging "$APK_PATH" | grep "package: name='${{ env.PACKAGE_NAME }}'" && echo "✅ Package name verified" || echo "⚠️ Could not verify package name"
          else
            echo "⚠️ APK not found, skipping verification"
          fi
      
      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          if [ -z "$VERSION" ]; then
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Rename build outputs with version
        run: |
          VERSION=${{ steps.version.outputs.version }}
          APK_DIR="capacitor-app/android/app/build/outputs/apk/debug"
          AAB_DIR="capacitor-app/android/app/build/outputs/bundle/release"
          
          if [ -f "$APK_DIR/app-debug.apk" ]; then
            mv "$APK_DIR/app-debug.apk" "$APK_DIR/ViP-Yemen-${VERSION}-debug.apk"
            echo "✅ APK renamed to ViP-Yemen-${VERSION}-debug.apk"
          fi
          
          if [ -f "$AAB_DIR/app-release.aab" ]; then
            mv "$AAB_DIR/app-release.aab" "$AAB_DIR/ViP-Yemen-${VERSION}-release.aab"
            echo "✅ AAB renamed to ViP-Yemen-${VERSION}-release.aab"
          fi
      
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            capacitor-app/android/app/build/outputs/apk/debug/*.apk
            capacitor-app/android/app/build/outputs/bundle/release/*.aab
          retention-days: 90

  # =============================================================================
  # Job 3: Create GitHub Release
  # =============================================================================
  create-release:
    name: Create GitHub Release
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          if [ -z "$VERSION" ]; then
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-builds
          path: release/
      
      - name: List release files
        run: ls -la release/
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: ViP Yemen v${{ steps.version.outputs.version }}
          body: |
            ## 🚀 ViP Yemen v${{ steps.version.outputs.version }}
            
            ### 📱 Android Downloads
            - **APK (Debug)**: تثبيت مباشر على أجهزة Android
            - **AAB (Release)**: للنشر على Google Play Store
            
            ### 📋 تعليمات التثبيت
            1. حمّل ملف `.apk`
            2. فعّل "تثبيت من مصادر غير معروفة" في إعدادات Android
            3. افتح الملف المحمل وتثبّت
            
            ### 🔐 معلومات الحزمة
            - **اسم الحزمة**: `com.vip.yemen`
            - **الإصدار**: ${{ steps.version.outputs.version }}
            - **الحد الأدنى**: Android 7.0
            
            ### 📝 التحديثات
            - تحسينات الأداء والإصلاحات
            - دعم ثنائي اللغة (عربي/إنجليزي)
            - نظام إشعارات متقدم
            - تحسينات الأتمتة
          files: |
            release/*.apk
            release/*.aab
          draft: false
          prerelease: false
          generate_release_notes: true
