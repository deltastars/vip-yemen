name: ViP Yemen Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 5.0.0)'
        required: false

env:
  PACKAGE_NAME: com.vip.yemen

jobs:
  build-web:
    name: Build Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        working-directory: website
        run: npm ci --legacy-peer-deps
      - name: TypeScript check
        working-directory: website
        run: npx tsc -b --noEmit
      - name: Build website
        working-directory: website
        run: npm run build
      - name: Verify Capacitor-compatible paths
        run: |
          if grep -q 'src="/assets/' website/dist/public/index.html; then
            echo "❌ FAIL: Absolute /assets/ paths in index.html"
            exit 1
          fi
          echo "✅ All asset paths are relative"
      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: website/dist/public/
          retention-days: 1

  build-android:
    name: Build Android
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Capacitor dependencies
        working-directory: capacitor-app
        run: npm ci || npm install
      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: capacitor-app/dist/
      - name: Sync Capacitor
        working-directory: capacitor-app
        run: npx cap sync android
      - name: Build debug APK
        working-directory: capacitor-app/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Build release AAB
        working-directory: capacitor-app/android
        run: ./gradlew bundleRelease --no-daemon --stacktrace
      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            # Auto-increment from build.gradle
            CURRENT=$(grep -o 'versionName "[^"]*"' capacitor-app/android/app/build.gradle | head -1 | cut -d'"' -f2)
            MAJOR=$(echo $CURRENT | cut -d. -f1)
            MINOR=$(echo $CURRENT | cut -d. -f2)
            PATCH=$(echo $CURRENT | cut -d. -f3)
            NEWPATCH=$((PATCH + 1))
            echo "version=${MAJOR}.${MINOR}.${NEWPATCH}" >> $GITHUB_OUTPUT
          fi
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            capacitor-app/android/app/build/outputs/apk/debug/app-debug.apk
            capacitor-app/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90

  create-release:
    name: Create Release
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release/
      - name: Create Source Archive
        run: |
          zip -r ViP-Yemen-${{ needs.build-android.outputs.version }}-source.zip . \
            -x '.git/*' 'node_modules/*' '*/node_modules/*' '*/build/*' '*/dist/*' '.github/*' '*.apk' '*.aab' '*.idsig' 2>/dev/null || true
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-android.outputs.version }}
          name: ViP Yemen v${{ needs.build-android.outputs.version }}
          body: |
            ## ViP Yemen v${{ needs.build-android.outputs.version }}

            ### 📱 Android Applications
            - **app-debug.apk** - Direct install on Android
            - **app-release.aab** - For Google Play Store

            ### 📦 Source Code
            - **source.zip** - Complete project source code

            ### 📋 Package Info
            - **Package**: `com.vip.yemen`
            - **Min Android**: 7.0 (SDK 24)
            - **Target Android**: 14 (SDK 36)

            ### 📥 Installation
            1. Download the debug APK for direct install
            2. For Google Play: use the AAB file
            3. Install over existing version (no uninstall needed)
          files: |
            release/android-builds/*
            ViP-Yemen-*-source.zip
          draft: false
          prerelease: false
