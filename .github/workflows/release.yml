name: ViP Yemen Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 1.2.0)'
        required: true
        default: '1.2.0'

env:
  PACKAGE_NAME: com.vip.yemen

jobs:
  build-web:
    name: Build Web Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install website dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile || pnpm install
      - name: Build website
        working-directory: website
        run: pnpm run build
      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: website/dist/
          retention-days: 1

  build-android:
    name: Build Android (APK + AAB)
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install Capacitor dependencies
        working-directory: capacitor-app
        run: npm ci || npm install
      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: capacitor-app/dist/
      - name: Sync Capacitor Android
        working-directory: capacitor-app
        run: npx cap sync android
      - name: Build debug APK
        working-directory: capacitor-app/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Build release AAB
        working-directory: capacitor-app/android
        run: ./gradlew bundleRelease --no-daemon --stacktrace
      - name: Rename builds
        run: |
          VERSION="${{ github.event.inputs.version }}"
          APK="capacitor-app/android/app/build/outputs/apk/debug"
          AAB="capacitor-app/android/app/build/outputs/bundle/release"
          [ -f "$APK/app-debug.apk" ] && mv "$APK/app-debug.apk" "$APK/ViP-Yemen-${VERSION}-debug.apk"
          [ -f "$AAB/app-release.aab" ] && mv "$AAB/app-release.aab" "$AAB/ViP-Yemen-${VERSION}-release.aab"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            capacitor-app/android/app/build/outputs/apk/debug/*.apk
            capacitor-app/android/app/build/outputs/bundle/release/*.aab
          retention-days: 90

  create-release:
    name: Create GitHub Release
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-builds
          path: release/
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: ViP Yemen v${{ github.event.inputs.version }}
          body: |
            ## ViP Yemen v${{ github.event.inputs.version }}
            
            ### Android Downloads
            - **APK**: Install directly on Android
            - **AAB**: For Google Play Store
            
            ### Package Info
            - **Package**: `com.vip.yemen`
            - **Min Android**: 7.0
            
            ### Auto-Update
            - Same package name for all versions
            - Install new APK over old version (no deletion needed)
          files: |
            release/*.apk
            release/*.aab
          draft: false
          prerelease: false
