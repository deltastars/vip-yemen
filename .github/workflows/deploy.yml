name: ViP Yemen CI/CD

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

env:
  PACKAGE_NAME: com.vip.yemen

jobs:
  web-check:
    name: Web Quality Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  android-build:
    name: Android Build (APK + AAB)
    needs: web-check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capacitor-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: capacitor-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run build
      - name: Sync Capacitor Android
        run: npx cap sync android
      - name: Build debug APK and release AAB
        working-directory: capacitor-app/android
        run: ./gradlew assembleDebug bundleRelease --no-daemon --stacktrace
      - name: Verify APK signature
        run: |
          $ANDROID_HOME/build-tools/*/apksigner verify --verbose capacitor-app/android/app/build/outputs/apk/debug/app-debug.apk || true
          $ANDROID_HOME/build-tools/*/apksigner verify --verbose capacitor-app/android/app/build/outputs/bundle/release/app-release.aab || true
      - name: Verify package name
        run: |
          $ANDROID_HOME/build-tools/*/aapt2 dump badging capacitor-app/android/app/build/outputs/apk/debug/app-debug.apk | grep -q "package: name='${{ env.PACKAGE_NAME }}'"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            capacitor-app/android/app/build/outputs/apk/debug/app-debug.apk
            capacitor-app/android/app/build/outputs/bundle/release/app-release.aab
          generate_release_notes: true

  ios-build:
    name: iOS Build
    needs: web-check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    defaults:
      run:
        working-directory: capacitor-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: capacitor-app/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Sync Capacitor iOS
        run: npx cap sync ios
      - name: Build iOS
        working-directory: capacitor-app/ios
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -archivePath build/App.xcarchive archive
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath build/output
