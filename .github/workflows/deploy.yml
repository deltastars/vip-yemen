name: ViP Yemen CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  PACKAGE_NAME: com.vip.yemen

jobs:
  web-check:
    name: Web Quality Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: website/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx tsc -b --noEmit
      - run: npm run build
      - name: Verify Capacitor-compatible paths
        run: |
          # Ensure no absolute /assets/ paths in built HTML
          if grep -q 'src="/assets/' dist/public/index.html; then
            echo "❌ FAIL: Absolute /assets/ paths found in index.html"
            exit 1
          fi
          echo "✅ Built output has correct relative paths"
