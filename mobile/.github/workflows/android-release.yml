name: vipyemen Native Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  android-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        working-directory: android-native
        run: gradle wrapper --gradle-version 8.10.2

      - name: Build debug APK and release AAB
        working-directory: android-native
        run: ./gradlew assembleDebug bundleRelease --no-daemon

      - name: Prepare release files
        run: |
          mkdir -p release
          cp android-native/app/build/outputs/apk/debug/app-debug.apk release/vipyemen.apk
          cp android-native/app/build/outputs/bundle/release/app-release.aab release/vipyemen.aab
          zip -qr release/vipyemen-source.zip . -x 'node_modules/*' '.git/*' '.manus-logs/*' 'release/*' '*.keystore' '*.jks' '.env*'

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/vipyemen.apk release/vipyemen.aab release/vipyemen-source.zip \
            --title "vipyemen ${GITHUB_REF_NAME}" \
            --notes "Native Android build. APK is debug-signed for direct testing. AAB is built for Play submission but requires owner-managed production signing before store publication."
