name: vipyemen Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  android-release:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        working-directory: mobile
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate Expo project
        working-directory: mobile
        run: pnpm exec expo config --type public

      - name: Install EAS CLI
        working-directory: mobile
        run: pnpm exec eas --version

      - name: Build APK
        working-directory: mobile
        run: pnpm exec eas build --platform android --profile preview --non-interactive --wait

      - name: Download APK artifact
        working-directory: mobile
        run: mkdir -p release && pnpm exec eas build:download --platform android --latest --output ./release/vipyemen.apk

      - name: Build AAB
        working-directory: mobile
        run: pnpm exec eas build --platform android --profile production --non-interactive --wait

      - name: Download AAB artifact
        working-directory: mobile
        run: pnpm exec eas build:download --platform android --latest --output ./release/vipyemen.aab

      - name: Create release archive
        run: |
          zip -qr ./mobile/release/vipyemen-source.zip . -x 'node_modules/*' '.expo/*' '.git/*' '*.keystore' '*.jks' '.env*' 'mobile/release/*'

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          gh release create "${GITHUB_REF_NAME}" ./mobile/release/vipyemen.apk ./mobile/release/vipyemen.aab ./mobile/release/vipyemen-source.zip \
            --title "vipyemen ${GITHUB_REF_NAME}" \
            --notes "Automated Android release for vipyemen. APK and AAB were built by EAS. Signing credentials remain managed by Expo/EAS and are not stored in the repository."
