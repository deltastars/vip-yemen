workflows:
  android-build:
    name: Android APK & AAB Build
    max_build_duration: 60
    environment:
      flutter: stable
      groups:
        - google_play_credentials
    scripts:
      - name: Setup environment
        script: |
          cd website
          bun install
          bun run build
      - name: Setup Android project
        script: |
          cd capacitor-app
          npm install
          npx cap sync android
      - name: Build APK (Debug)
        script: |
          cd capacitor-app/android
          ./gradlew assembleDebug
      - name: Build AAB (Release)
        script: |
          cd capacitor-app/android
          ./gradlew bundleRelease
      - name: Copy artifacts
        script: |
          mkdir -p website/client/public/releases
          cp capacitor-app/android/app/build/outputs/apk/debug/*.apk website/client/public/releases/ViP-Yemen-1.3.0-debug.apk
          cp capacitor-app/android/app/build/outputs/bundle/release/*.aab website/client/public/releases/ViP-Yemen-1.3.0-release.aab
    artifacts:
      - website/client/public/releases/*.apk
      - website/client/public/releases/*.aab
    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_credentials
        track: internal
        status: internal

  ios-build:
    name: iOS Build
    max_build_duration: 60
    environment:
      flutter: stable
      groups:
        - app_store_credentials
    scripts:
      - name: Setup environment
        script: |
          cd website
          bun install
          bun run build
      - name: Setup iOS project
        script: |
          cd capacitor-app
          npm install
          npx cap sync ios
      - name: Build iOS
        script: |
          cd capacitor-app/ios
          xcodebuild -workspace App.xcworkspace -scheme App -sdk iphoneos -configuration Release archive
    artifacts:
      - capacitor-app/ios/build/*.ipa
    publishing:
      app_store_connect:
        auth: integration

  pwa-build:
    name: PWA & Web Build
    max_build_duration: 30
    environment:
      node: 20
    scripts:
      - name: Setup environment
        script: |
          cd website
          bun install
      - name: Build web app
        script: |
          cd website
          bun run build
      - name: Verify build output
        script: |
          ls -la website/dist/public/
    artifacts:
      - website/dist/public/**
