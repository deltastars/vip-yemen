plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vipyemen.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.vipyemen.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            shrinkResources false
            // Uses the standard debug key only for internal validation.
            // Store release signing must be configured by the app owner.
            signingConfig signingConfigs.debug
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
